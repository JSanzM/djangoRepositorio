{% extends "base.html" %}

{% block title %}Libros de Trenes{% endblock %}

{% block content %}
    <h1>{% if libro %}Editar Libro{% else %}Nuevo Libro{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'libro_trenes:libro_trenes' %}">Volver a la lista</a></p>

{% endblock %}
