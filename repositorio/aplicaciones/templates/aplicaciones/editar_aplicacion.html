{% extends "base.html" %}

{% block title %}Aplicaciones{% endblock %}

{% block content %}
    <h1>{% if cd %}Editar Aplicación{% else %}Nuevo Aplicación{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'aplicaciones:aplicaciones' %}">Volver a la lista</a></p>

{% endblock %}
