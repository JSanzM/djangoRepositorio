{% extends "base.html" %}

{% block title %}Juegos{% endblock %}

{% block content %}
    <h1>{% if cd %}Editar Juego{% else %}Nuevo Juego{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'juegos:juegos' %}">Volver a la lista</a></p>

{% endblock %}
